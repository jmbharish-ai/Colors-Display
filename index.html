<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Colors Display</title>
        <style>
            body{
                background-color: white;
                text-align: left;
            }
            .number{
                width: 105px; height: 105px;
                background-color: white; color: black;
                text-align: center; font-size: 50px; font-family: Arial, Helvetica, sans-serif;
                border: 2px solid black; border-radius: 0px;

                display: inline-block;
                margin: 5px 0px 5px 5px;
                line-height: 105px;
                vertical-align: middle;
            }
            .color{
                width: 105px; height: 105px;
                border: 2px solid black; border-radius: 0px;

                display: inline-block;
                margin: 5px 5px 5px 0px;
                vertical-align: middle;
            }
        </style>
    </head>
    <body>
        <script>
            var colors=[
                "rgb(127, 127, 127)", // 1
                "rgb(255, 191, 0)", // 2
                "rgb(255, 191, 127)", // 3
                "rgb(255, 159, 127)", // 4
                "rgb(191, 127, 255)", // 5
                "rgb(127, 0, 63)", // 6
                "rgb(63, 63, 127)", // 7
                "rgb(127, 255, 191)", // 8
                "rgb(255, 0, 0)", // 9
                "rgb(255, 0, 127)", // 10
                "rgb(0, 191, 255)", // 11
                "rgb(0, 127, 95)", // 12
                "rgb(255, 0, 255)", // 13
                "rgb(95, 63, 127)", // 14
                "rgb(255, 127, 0)", // 15
                "rgb(0, 127, 0)", // 16
                "rgb(255, 127, 191)", // 17
                "rgb(127, 191, 255)", // 18
                "rgb(63, 127, 95)", // 19
                "rgb(127, 0, 127)", // 20
                "rgb(0, 127, 255)", // 21
                "rgb(127, 63, 95)", // 22
                "rgb(127, 79, 63)", // 23
                "rgb(63, 95, 127)", // 24
                "rgb(127, 0, 0)", // 25
                "rgb(127, 95, 95)", // 26
                "rgb(127, 63, 0)", // 27
                "rgb(0, 0, 255)", // 28
                "rgb(0, 63, 127)", // 29
                "rgb(127, 127, 255)", // 30
                "rgb(127, 111, 63)", // 31
                "rgb(255, 127, 127)", // 32
                "rgb(127, 127, 0)", // 33
                "rgb(0, 255, 0)", // 34
                "rgb(255, 255, 0)", // 35
                "rgb(0, 95, 127)", // 36
                "rgb(255, 223, 127)", // 37
                "rgb(127, 95, 0)", // 38
                "rgb(127, 0, 255)", // 39
                "rgb(0, 255, 191)", // 40
                "rgb(255, 255, 255)", // 41
                "rgb(0, 255, 255)", // 42
                "rgb(255, 191, 191)", // 43
                "rgb(0, 0, 0)", // 44
                "rgb(127, 63, 63)", // 45
                "rgb(0, 127, 127)", // 46
                "rgb(127, 95, 63)" // 47
            ];
            for(var i=0; i<colors.length; i++){
                var number=document.createElement("label");
                document.body.appendChild(number);
                number.className="number";
                number.innerHTML=i+1;

                var color=document.createElement("label");
                document.body.appendChild(color);
                color.className="color";
                color.style.backgroundColor=colors[i];

                if((i+1)%4==0){
                    var br=document.createElement("br");
                    document.body.appendChild(br);
                }
            }
        </script>
    </body>
</html>
